[package]
name = "handl-kit-pkg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Package kit — .handl.toml project discovery and dependency wiring for the prelude Kit."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["handl", "kit", "packages"]
categories = ["development-tools"]

[dependencies]
handl-kit-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
